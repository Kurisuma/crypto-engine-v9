[package]
name = "gw-imprce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Sovereign In-Memory Priority-Redundant Cache Engine with Self-Healing Quorum & Zeroize Hygiene"

[lints]
workspace = true

[dependencies]
gw-primitives = { path = "../gw-primitives" }
gw-storage-oberer = { path = "../gw-storage-oberer" }
gw-enterprise-traits = { path = "../gw-enterprise-traits" }
oberer-orm = { path = "../../../Oberer-lite/oberer-orm" }
async-trait = "0.1"
blake3 = { version = "1.5", features = ["zeroize"] }
crc32fast = "1.4"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["sync", "rt", "macros", "time"] }
parking_lot = "0.12"
thiserror = "2.0"
sha2 = "0.10"

[dev-dependencies]
proptest = "1.5"
