[package]
name = "gw-chain-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gw-primitives = { path = "../gw-primitives" }
gw-storage-oberer = { path = "../gw-storage-oberer" }
gw-enterprise-traits = { path = "../gw-enterprise-traits" }
oberer-orm = { path = "../../../Oberer-lite/oberer-orm" }
async-trait = "0.1"
alloy-primitives = { version = "0.8", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
bech32 = "0.11"
bs58 = { version = "0.5", features = ["check"] }
blake3 = "1.5"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
tokio = { version = "1.40", features = ["sync", "rt", "macros"] }

[dev-dependencies]
proptest = "1.5"
