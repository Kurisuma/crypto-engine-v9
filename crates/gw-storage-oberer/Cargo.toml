[package]
name = "gw-storage-oberer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gw-primitives = { path = "../gw-primitives" }
gw-enterprise-traits = { path = "../gw-enterprise-traits" }
oberer-orm = { path = "../../oberer-lite/oberer-orm" }
oberer-orm-derive = { path = "../../oberer-lite/oberer-orm-derive" }
async-trait = "0.1"
blake3 = { version = "1.5", features = ["zeroize"] }
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["sync", "rt", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
sha2 = "0.10"

[dev-dependencies]
proptest = "1.5"
