[package]
name = "gw-kms-enclave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gw-primitives = { path = "../gw-primitives" }
gw-enterprise-traits = { path = "../gw-enterprise-traits" }
async-trait = "0.1"
alloy-primitives = { version = "0.8", default-features = false }
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
zeroize = { version = "1.8", features = ["derive"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "schnorr", "std"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }
bs58 = { version = "0.5", features = ["check"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1.40", features = ["sync", "rt", "macros"] }

[dev-dependencies]
proptest = "1.5"
